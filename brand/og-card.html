<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Reorder demo — Open Graph card</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
  />

  <!--
  Source for public/og-1200x630.png, the link-preview card for the demo page.
  Not served: this folder sits outside public/, so the build never copies it.

  To re-render (gstack browse, scale 1; 1200x630 is already the final size):
    B="$HOME/.claude/skills/gstack/browse/dist/browse"
    $B viewport 1300x700 --scale 1
    $B goto "file://$PWD/brand/og-card.html"
    $B js "document.fonts.check('600 60px \"Space Grotesk\"')"   # must print true
    $B screenshot public/og-1200x630.png --selector .card
    sips -g pixelWidth -g pixelHeight public/og-1200x630.png      # must be 1200 x 630

  Two traps, each of which yields a plausible-looking WRONG file (same as
  willawave-ai/brand/linkedin-banner.html):
  1. Capturing before the webfont loads silently falls back to system-ui.
  2. Centering the card puts it on a fractional offset and the capture rounds
     up a pixel. Hence no centering below.

  THE CHART IS COMPUTED, NOT DRAWN. Both paths come from the model, scaled to a
  460x260 box with the y-axis topped at 1.05 x the larger series' peak (157.5):
    usual season: BASELINE (src/app/model/baseline.ts)
    2012:         actualDemand({ baseline: BASELINE,
                    weatherIndex: weatherIndex(weather, 2012),
                    trueSensitivity: 0.3 })   // the page default
  Re-run them if the baseline, the weather data or the model changes. The card
  shows no unit counts on purpose: sales are hypothetical.

  The W mark's paths and colours are copied from public/brand/wordmark-dark.svg.
-->

  <style>
    :root {
      --navy: #0a2540;
      --brand: #005eb8;
      --mid: #4a90d9;
      --back: #7fb3e3;
      --paper: #fff;
      --muted: #a9c4e0;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* No centering: a fractional offset rounds the element capture up a pixel. */
    body {
      background: #333;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--navy);
      color: var(--paper);
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      display: grid;
      grid-template-columns: 560px 1fr;
      column-gap: 48px;
      padding: 56px 64px 48px;
    }

    .copy {
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 26px;
      font-weight: 500;
    }
    .brand svg {
      width: 54px;
      height: 41px;
    }
    .brand .demo {
      color: var(--back);
    }
    h1 {
      margin-top: 52px;
      font-size: 58px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .sub {
      margin-top: 28px;
      font-size: 27px;
      line-height: 1.35;
      color: var(--muted);
    }
    .url {
      margin-top: auto;
      font-size: 24px;
      font-weight: 500;
      color: var(--back);
    }

    .chart {
      align-self: center;
      margin-top: 24px;
    }
    .chart svg {
      display: block;
      overflow: visible;
    }
    .chart text {
      font-family: inherit;
      fill: var(--muted);
      font-size: 20px;
    }
    .note {
      position: absolute;
      right: 64px;
      bottom: 48px;
      /* LinkedIn shows the card about 552px wide; 23px stays readable at that scale. */
      font-size: 23px;
      color: var(--muted);
    }
  </style>

  <div class="card">
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 105 80" aria-hidden="true">
          <g transform="translate(2,6)">
            <path
              d="M4 14 C 12 52, 20 66, 27 66 C 35 66, 40 44, 45 30 C 48 22, 52 22, 55 30 C 60 44, 65 66, 73 66 C 80 66, 88 52, 96 14"
              fill="none"
              stroke="#4A90D9"
              stroke-width="9"
              stroke-linecap="round"
              opacity="0.55"
              transform="translate(0,-8)"
            />
            <path
              d="M4 14 C 12 52, 20 66, 27 66 C 35 66, 40 44, 45 30 C 48 22, 52 22, 55 30 C 60 44, 65 66, 73 66 C 80 66, 88 52, 96 14"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="11"
              stroke-linecap="round"
            />
          </g>
        </svg>
        <span>WillaWave <span class="demo">· Reorder demo</span></span>
      </div>
      <h1>Would the weather have changed your flea and tick order?</h1>
      <p class="sub">Replay real Omaha weather, 2010–2025, against two reorder plans.</p>
      <p class="url">reorder-demo.willawave.ai</p>
    </div>

    <div class="chart">
      <svg width="460" height="300" viewBox="0 0 460 300" aria-hidden="true">
        <line x1="0" y1="262" x2="460" y2="262" stroke="#3B5878" stroke-width="2" />
        <text x="0" y="292">Mar</text>
        <text x="460" y="292" text-anchor="end">Oct</text>

        <!-- usual season: BASELINE -->
        <path
          d="M0.0 235.2 L13.5 227.0 L27.1 210.5 L40.6 194.0 L54.1 177.5 L67.6 161.0 L81.2 152.7 L94.7 136.2 L108.2 127.9 L121.8 119.7 L135.3 111.4 L148.8 103.2 L162.4 103.2 L175.9 94.9 L189.4 94.9 L202.9 94.9 L216.5 94.9 L230.0 94.9 L243.5 94.9 L257.1 94.9 L270.6 103.2 L284.1 103.2 L297.6 111.4 L311.2 119.7 L324.7 127.9 L338.2 136.2 L351.8 144.4 L365.3 161.0 L378.8 177.5 L392.4 185.7 L405.9 194.0 L419.4 210.5 L432.9 218.7 L446.5 227.0 L460.0 235.2"
          fill="none"
          stroke="var(--muted)"
          stroke-width="3"
          stroke-dasharray="8 7"
          stroke-linejoin="round"
        />
        <!-- 2012: actualDemand at trueSensitivity 0.3 -->
        <path
          d="M0.0 225.3 L13.5 213.8 L27.1 187.4 L40.6 157.7 L54.1 118.0 L67.6 85.0 L81.2 37.1 L94.7 55.3 L108.2 98.2 L121.8 70.2 L135.3 78.4 L148.8 55.3 L162.4 53.7 L175.9 80.1 L189.4 70.2 L202.9 90.0 L216.5 103.2 L230.0 53.7 L243.5 42.1 L257.1 20.6 L270.6 17.3 L284.1 12.4 L297.6 38.8 L311.2 55.3 L324.7 90.0 L338.2 124.6 L351.8 132.9 L365.3 154.3 L378.8 164.3 L392.4 182.4 L405.9 197.3 L419.4 246.8 L432.9 250.1 L446.5 248.4 L460.0 253.4"
          fill="none"
          stroke="var(--mid)"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />

        <!-- legend, above the plot -->
        <line
          x1="0"
          y1="-70"
          x2="32"
          y2="-70"
          stroke="var(--mid)"
          stroke-width="5"
          stroke-linecap="round"
        />
        <text x="44" y="-63" style="fill: var(--paper); font-weight: 600">
          2012, an early warm March
        </text>
        <line
          x1="0"
          y1="-38"
          x2="32"
          y2="-38"
          stroke="var(--muted)"
          stroke-width="3"
          stroke-dasharray="8 7"
        />
        <text x="44" y="-31">usual season</text>
      </svg>
    </div>

    <p class="note">Weather: NOAA, Omaha · sales hypothetical</p>
  </div>
</html>
