# Job names are the required status checks on `main` (branch protection), so
# renaming a job means updating the protection rule too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Fails below the coverage thresholds in vitest-base.config.mts.
      - run: pnpm test:coverage
      - run: pnpm test:scripts
      # Rebuilds first on purpose; see the header of scripts/verify-build.mjs.
      - run: pnpm verify:build

  # Real-browser checks on the built site: AXE in both themes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:hosting
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
